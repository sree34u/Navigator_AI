[project]
name = "upsc-current-affairs-generator"
version = "0.1.0"
description = "AI-powered UPSC Current Affairs Magazine Generator"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [
    { name = "UPSC Magazine Team" }
]
dependencies = [
    "playwright==1.48.0",
    "openai==1.54.3",
    "anthropic==0.39.0",
    "feedparser==6.0.11",
    "httpx==0.27.2",
    "sqlalchemy==2.0.36",
    "alembic==1.13.3",
    "streamlit==1.39.0",
    "jinja2==3.1.4",
    "weasyprint==62.3",
    "pydantic==2.9.2",
    "pydantic-settings==2.6.1",
    "python-dotenv==1.0.1",
    "PyYAML==6.0.2",
    "tenacity==9.0.0",
    "loguru==0.7.2",
    "beautifulsoup4==4.12.3",
    "lxml==5.3.0",
    "python-slugify==8.0.4",
]

[project.optional-dependencies]
dev = [
    "ruff==0.7.4",
    "pytest==8.3.3",
    "pytest-cov==5.0.0",
    "pytest-asyncio==0.24.0",
    "pytest-mock==3.14.0",
]

[build-system]
requires = ["setuptools>=75.3.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
    "C4",
    "SIM",
    "N",
    "ANN",
    "RUF",
]
ignore = [
    "ANN101",
    "ANN102",
]

[tool.ruff.lint.isort]
known-first-party = ["upsc_magazine"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --cov=src/upsc_magazine --cov-report=term-missing"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/upsc_magazine"]
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]